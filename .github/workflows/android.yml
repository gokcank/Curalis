name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6
      
    # Robolectric downloads its Android runtime jars (~200 MB each) to ~/.m2 while the tests
    # run; the Gradle cache above doesn't cover them, so without this every run re-downloads
    # them from Maven Central and can hit its rate limit.
    - name: Cache Robolectric Android runtimes
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

    - name: Build and Test
      run: ./gradlew test assembleDebug
