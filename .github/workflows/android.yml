name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # cache: gradle (Will be re-enabled in Phase 2)

    # - name: Grant execute permission for gradlew
    #   run: chmod +x gradlew
      
    # Note: Replace this with `./gradlew build` once Android project is created
    # - name: Validate Gradle Wrapper
    #   uses: gradle/actions/wrapper-validation@v3
